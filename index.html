<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3b4c">
<title>Raviraja Quotations</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Raviraja">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f2530; --ink2:#4a5d66; --ink3:#8a9aa2; --line:#e3e9ec; --bg:#f3f6f7; --card:#fff;
  --brand:#0f3b4c; --brand2:#16566e; --accent:#f2a33a; --accent-ink:#5a3600;
  --ok:#1f8a5b; --ok-bg:#e6f5ee; --warn-bg:#fff4e2; --info-bg:#e7f1f6; --danger:#c2412d;
  --r:14px; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior-y:none;background:#d9e2e6;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
.phone{max-width:440px;height:100%;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(15,37,48,.15)}
.top{background:var(--brand);color:#fff;padding:calc(14px + var(--safe-t)) 18px 14px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.top h1{font-size:18px;font-weight:700;margin:0;flex:1;letter-spacing:-.2px}
.top .sub{font-size:12px;opacity:.7;font-weight:500}
.iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.1)}
.iconbtn svg{width:20px;height:20px}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 16px calc(96px + var(--safe-b))}
.nav{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + var(--safe-b))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink3);padding:4px 0}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--brand)}
.nav .fab{flex:0 0 64px}
.nav .fab span{width:52px;height:52px;margin-top:-26px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 16px rgba(242,163,58,.45)}
.card{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid var(--line)}
.stack>*+*{margin-top:12px}
.h2{font-size:13px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px;margin:20px 2px 10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--ink3);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:"JetBrains Mono",monospace;font-size:12px}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-QUOTATION{background:var(--info-bg);color:var(--brand2)}
.p-PI{background:var(--warn-bg);color:#9a5b00}
.p-INVOICE{background:var(--ok-bg);color:var(--ok)}
.p-CONVERTED{background:#eef0f1;color:var(--ink3)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:20px;font-weight:800;margin-top:4px;letter-spacing:-.4px}
.stat.hero{grid-column:1/-1;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0}
.stat.hero .muted{color:rgba(255,255,255,.7)}
.stat.hero b{font-size:26px}
.doc{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);width:100%;text-align:left}
.doc+.doc{margin-top:8px}
.doc .amt{font-weight:700;text-align:right}
.tabs{display:flex;gap:6px;background:#e6ecef;padding:4px;border-radius:12px}
.tabs button{flex:1;padding:8px 4px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.tabs button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{display:block}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:0 0 6px 2px}
.field input,.field select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:15px;outline:none}
.field input:focus,.field select:focus{border-color:var(--brand2)}
.btn{width:100%;padding:14px;border-radius:13px;font-weight:700;font-size:15px;background:var(--brand);color:#fff}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--ink2)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.prof{display:flex;align-items:center;gap:10px;padding:11px 12px;background:#fff;border:1px solid var(--line);border-radius:12px}
.prof+.prof{margin-top:7px}
.prof.sel{border-color:var(--brand2);background:#f5fafc;box-shadow:inset 3px 0 0 var(--brand2)}
.code{font-family:"JetBrains Mono",monospace;font-size:11.5px;background:#eef3f5;color:var(--brand2);padding:2px 6px;border-radius:6px}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;flex-shrink:0}
.stepper button{width:40px;height:40px;font-size:18px;font-weight:700;color:var(--brand)}
.stepper input{width:38px;text-align:center;border:0;font-weight:700;font-size:15px;padding:0;outline:none;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.calcline{font-size:11.5px;color:var(--ink2);margin-top:3px}
.calcline b{color:var(--ink)}
.sumbar{position:absolute;left:12px;right:12px;bottom:calc(84px + var(--safe-b));background:var(--ink);color:#fff;border-radius:16px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 24px rgba(15,37,48,.3)}
.sumbar .btn{width:auto;padding:11px 16px;font-size:14px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;outline:none;padding:11px 0;flex:1;font-size:15px;background:none}
.search svg{width:18px;height:18px;color:var(--ink3)}
/* document view */
.paper{background:#fff;border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.paper .hd{background:var(--brand);color:#fff;padding:14px 16px}
.paper .hd .t{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--accent)}
.paper .hd .co{font-weight:800;font-size:15px;margin-top:4px}
.paper .hd .ad{font-size:11px;opacity:.75;margin-top:3px;line-height:1.45}
.meta{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.meta div{padding:10px 16px;font-size:12px}
.meta div:nth-child(odd){border-right:1px solid var(--line)}
.meta div+div+div{border-top:1px solid var(--line)}
.meta b{display:block;font-size:13.5px;margin-top:2px}
.billto{padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px}
.billto b{font-size:14px;display:block;margin:3px 0}
.sec{padding:8px 16px;background:#f3f7f9;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--brand2);border-bottom:1px solid var(--line)}
.li{padding:10px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:22px 1fr auto;gap:2px 8px}
.li .n{color:var(--ink3);font-size:12px;padding-top:1px}
.li .d{font-weight:700;font-size:13.5px}
.li .a{font-weight:700;text-align:right;font-size:13.5px}
.li .x{grid-column:2/4;font-size:11.5px;color:var(--ink2)}
.tot{padding:12px 16px}
.tot .r{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.tot .g{border-top:2px solid var(--ink);margin-top:8px;padding-top:10px;font-size:17px;font-weight:800}
.words{margin:0 16px 14px;padding:10px 12px;background:var(--warn-bg);border-radius:10px;font-size:12px;font-weight:600;color:#7a4a00}
.bank{padding:12px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink2);line-height:1.6}
.sheet-bg{position:absolute;inset:0;background:rgba(15,37,48,.45);display:flex;align-items:flex-end;z-index:20;animation:fade .15s}
.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:8px 18px calc(20px + var(--safe-b));max-height:88%;overflow-y:auto;animation:up .2s ease-out}
.sheet .grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:4px auto 14px}
.sheet h3{margin:0 0 14px;font-size:17px}
.sheet-bg.still,.sheet-bg.still .sheet{animation:none}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.toast{position:absolute;left:50%;top:calc(76px + var(--safe-t));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:30;animation:fade .2s;white-space:nowrap}
.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 26px calc(28px + var(--safe-b));background:linear-gradient(180deg,var(--brand) 0 38%,var(--bg) 38%)}
.logo{width:58px;height:58px;border-radius:17px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:800;font-size:22px;margin-bottom:14px}
.err{background:#fdecea;color:var(--danger);padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600}
.empty{text-align:center;padding:40px 20px;color:var(--ink3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.exp button{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:13px;font-weight:700;font-size:14px;background:#fff;border:1.5px solid var(--line)}
.exp button svg{width:20px;height:20px}
.exp .pdf{color:#b3261e}.exp .xls{color:#1d6f42}
.exp button:disabled{opacity:.5}
.ptab{width:100%;border-collapse:collapse;margin-top:8px}
.ptab th{font-size:11px;color:var(--ink3);font-weight:700;text-align:center;padding:4px}
.ptab td{padding:4px;font-size:13.5px;font-weight:600}
.ptab td:first-child{width:34%}
.pin{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-weight:700;text-align:center;outline:none;background:#fff}
.pin:focus{border-color:var(--brand2)}
.pin.saved{border-color:var(--ok);background:var(--ok-bg)}
.balrow{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:10px 12px;border-radius:11px;background:#f6f8f9;border:1px dashed var(--line);font-size:13px;font-weight:600;text-align:left}
.trbox{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:10px 16px 12px;border-bottom:1px solid var(--line);background:#fafbfc}
.trbox span{display:block;font-size:10.5px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.trbox b{font-size:13px;word-break:break-word}
.wabtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:13px;background:#25d366;color:#05371b;font-weight:800;font-size:15px;margin-bottom:10px}
.wabtn svg{width:22px;height:22px}
a.wabtn{text-decoration:none}
.wamsg{white-space:pre-wrap;font-size:12.5px;line-height:1.45;background:#e7fbe9;border-radius:12px;padding:12px;max-height:210px;overflow:auto;border:1px solid #c8efcf}
.wastep{display:flex;gap:10px;align-items:center}
.wastep .n{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
.delbtn{margin-top:22px;color:var(--danger);border-color:#f3c9c2;display:flex;align-items:center;justify-content:center;gap:8px}
.delbtn svg{width:19px;height:19px}
.stickybrand{position:sticky;top:-16px;z-index:5;margin:0 -16px;padding:10px 16px 10px;background:rgba(243,246,247,.96);backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:7px}
.chip.ser{border-radius:9px;background:#e9eff2;border-color:#e9eff2;font-weight:700;color:var(--brand2)}
.chip.ser.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stickybrand.stuck{box-shadow:0 6px 12px -8px rgba(15,37,48,.35);border-bottom:1px solid var(--line)}
.editnote{background:var(--warn-bg);color:#7a4a00;padding:10px 12px;border-radius:11px;font-size:13px;line-height:1.45}

/* ---------- home ---------- */
.hometop{padding-bottom:16px}
.avatar{width:42px;height:42px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:15px;flex-shrink:0}
.avatar.sm{width:38px;height:38px;border-radius:11px;font-size:13px;background:#e6eef1;color:var(--brand)}
.rolechip{background:rgba(255,255,255,.16);padding:1px 8px;border-radius:999px;font-weight:700;font-size:11px;letter-spacing:.3px}
.qagrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink2);text-align:center;transition:transform .12s}
.qa svg{width:22px;height:22px;color:var(--brand2)}
.qa:active{transform:scale(.96)}
/* ---------- settings ---------- */
.tiles{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tile{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left;cursor:pointer}
.tile+.tile{border-top:1px solid var(--line)}
.tile b{display:block;font-size:14.5px}
.tile .muted{display:block;margin-top:2px}
.ti{width:38px;height:38px;border-radius:11px;background:var(--info-bg);color:var(--brand2);display:grid;place-items:center;flex-shrink:0}
.ti svg{width:20px;height:20px}
.chev{color:var(--ink3);font-size:22px;font-weight:300}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;display:inline-flex;align-items:center;cursor:pointer}
.logocard{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.logobox{width:96px;height:64px;border-radius:10px;border:1.5px dashed var(--line);display:grid;place-items:center;flex-shrink:0;overflow:hidden;
  background:repeating-conic-gradient(#f3f6f7 0 25%,#fff 0 50%) 0 0/12px 12px}
.logobox img{max-width:88px;max-height:56px;object-fit:contain}
.usercard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.role-admin{background:#efe7ff;color:#5b21b6}.role-accounts{background:var(--ok-bg);color:var(--ok)}.role-sales{background:var(--info-bg);color:var(--brand2)}
.roleinfo{display:flex;gap:10px;align-items:center;padding:6px 2px}
.roleinfo .pill{min-width:72px;text-align:center}
.rolepick{display:block;width:100%;text-align:left;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.rolepick b{display:block;font-size:14px}
.rolepick.on{border-color:var(--brand2);background:#f1f8fb;box-shadow:inset 3px 0 0 var(--brand2)}
.linkbtn{font-size:12.5px;font-weight:700;color:var(--brand2);margin-left:auto}
/* ---------- PDF designer + preview ---------- */
.pv{display:flex;flex-direction:column;gap:12px}
.pvpage{width:100%;height:auto;border-radius:6px;box-shadow:0 2px 10px rgba(15,37,48,.14),0 0 0 1px rgba(15,37,48,.06);background:#fff}
.pvload{height:240px;display:grid;place-items:center;color:var(--ink3);font-size:13px;background:#fff;border-radius:8px;border:1px dashed var(--line)}
.pvhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pvhead select{flex:1;min-width:0;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600}
.dpreview{position:sticky;top:-16px;z-index:4;margin:-16px -16px 14px;padding:12px 16px;background:#e4ebee;max-height:46vh;overflow-y:auto;border-bottom:1px solid var(--line);box-shadow:0 8px 14px -12px rgba(15,37,48,.4)}
.dcontrols{display:flex;flex-direction:column;gap:12px}
.dsec{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.dlab{display:flex;align-items:center;font-size:12px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.sublab{font-size:12px;font-weight:700;color:var(--ink3);margin:12px 0 7px}
.seg button{font-size:12px}
.laygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.laycard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px 9px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:12px;font-weight:700;color:var(--ink2)}
.laycard svg{width:100%;height:auto;border-radius:6px;background:#fff;border:1px solid #eef2f4}
.laycard.on{border-color:var(--brand2);color:var(--brand);box-shadow:0 0 0 3px rgba(22,86,110,.12)}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;position:relative}
.swatch.on{box-shadow:0 0 0 2.5px var(--ink)}
.swatch.custom{background:conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red);overflow:hidden}
.swatch.custom input{opacity:0;width:100%;height:100%;cursor:pointer}
.toggrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.tog{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;font-weight:600;text-align:left;color:var(--ink)}
.tog .sw{width:36px;height:21px;border-radius:999px;background:#cfd8dc;position:relative;flex-shrink:0;transition:background .15s}
.tog .sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.tog.on .sw{background:var(--ok)}
.tog.on .sw::after{transform:translateX(15px)}
.pvscroll{padding-bottom:calc(150px + var(--safe-b))}
.pvbar{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px calc(12px + var(--safe-b));background:#fff;border-top:1px solid var(--line);z-index:6}
.pvbar .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px}
/* wide screens: designer side by side */
.designer.pvbig .dpreview{max-height:none;position:relative;top:0}
.phone.wide .pvexp{display:none}
.phone.wide{max-width:1180px}
.phone.wide .designer{display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start}
.phone.wide .dpreview{order:2;position:sticky;top:0;margin:0;max-height:calc(100vh - 170px);border-radius:14px;border:1px solid var(--line)}
.phone.wide .dcontrols{order:1}
.phone.wide .pvscroll .pv{max-width:820px;margin:0 auto}
.phone.wide .nav{max-width:440px;margin:0 auto;border-radius:16px 16px 0 0;border:1px solid var(--line)}
.phone.wide .pvbar{max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;border:1px solid var(--line)}
.btag{font-size:10px;font-weight:800;letter-spacing:.3px;padding:2px 6px;border-radius:6px;background:#fff4e2;color:#8a5200;border:1px solid #f6dfb7}
.listsum{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 8px;font-size:12.5px;color:var(--ink3);font-weight:600}
.listsum b{color:var(--ink);font-size:14px}

function sha256(str){const K=[],H=[];let n=2,c=0;const f=x=>(x-Math.floor(x))*4294967296|0;
  while(c<64){let p=true;for(let i=2;i*i<=n;i++)if(n%i===0){p=false;break}if(p){if(c<8)H[c]=f(Math.pow(n,1/2));K[c]=f(Math.pow(n,1/3));c++}n++}
  const b=unescape(encodeURIComponent(str)),l=b.length*8,w=[];for(let i=0;i<b.length;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
  w[l>>5]|=0x80<<(24-l%32);w[((l+64>>9)<<4)+15]=l;const h=H.slice();
  for(let j=0;j<w.length;j+=16){const W=[],a=h.slice();for(let i=0;i<64;i++){
    if(i<16)W[i]=w[j+i]|0;else{const x=W[i-15],y=W[i-2];W[i]=(((x>>>7|x<<25)^(x>>>18|x<<14)^x>>>3)+W[i-7]+((y>>>17|y<<15)^(y>>>19|y<<13)^y>>>10)+W[i-16])|0}
    const t1=a[7]+((a[4]>>>6|a[4]<<26)^(a[4]>>>11|a[4]<<21)^(a[4]>>>25|a[4]<<7))+((a[4]&a[5])^(~a[4]&a[6]))+K[i]+W[i]|0;
    const t2=((a[0]>>>2|a[0]<<30)^(a[0]>>>13|a[0]<<19)^(a[0]>>>22|a[0]<<10))+((a[0]&a[1])^(a[0]&a[2])^(a[1]&a[2]))|0;
    a.unshift(t1+t2|0);a[4]=a[4]+t1|0;a.pop()}for(let i=0;i<8;i++)h[i]=h[i]+a[i]|0}
  return h.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")}

/* Phone back button: every screen and open panel gets a #hash entry, so Back steps back inside the app */
const NAV={fromHash:false,skip:0};
const curHash=()=>decodeURIComponent((location.hash||"").slice(1));
function setScreenHash(screen,prev){if(NAV.fromHash)return;const h="s-"+screen,cur=curHash();
  try{if(cur.endsWith("-panel")||prev==="login"||screen==="login")location.replace("#"+h);else if(cur!==h)location.hash=h}catch(e){}}
function go(screen,extra={}){const prev=S.screen;setScreenHash(screen,prev);Object.assign(S,{screen,sheet:null},extra);render();const sc=document.querySelector(".scroll");if(sc)sc.scrollTop=0}
function syncPanelHash(){if(NAV.fromHash||!S.user)return;const cur=curHash(),isP=cur.endsWith("-panel");
  try{if(S.sheet&&!isP)location.hash="s-"+S.screen+"-panel";else if(!S.sheet&&isP){NAV.skip++;clearTimeout(NAV.t);NAV.t=setTimeout(()=>NAV.skip=0,900);history.back()}}catch(e){}}
window.addEventListener("hashchange",()=>{
  if(NAV.skip>0){NAV.skip--;return}
  const h=curHash(),m=h.match(/^s-([a-z]+)(-panel)?$/);
  if(!S.user){if(S.screen!=="login"){S.screen="login";render()}return}
  if(!m||m[1]==="login")return;
  const target=m[1],panel=!!m[2];
  NAV.fromHash=true;
  try{
    if(S.sheet&&!panel){if(["pending","leave"].includes(S.sheet.kind)&&target===S.screen){S.sheet=null;render()}else{S.sheet=null;render()}
      if(target===S.screen)return}
    if(panel&&!S.sheet){if(target!==S.screen&&SCREENS[target]){S.screen=target;render()}return}
    if(target!==S.screen&&SCREENS[target]){
      if(S.screen==="new"&&S.draft&&S.draft.editId){NAV.fromHash=false;location.hash="s-new";S.sheet={kind:"leave",to:target};render();return}
      if((target==="view"||target==="pdfview")&&!DB.docs.find(x=>x.id===S.view)){S.screen="docs"}else S.screen=target;
      S.sheet=null;render();const sc=document.querySelector(".scroll");if(sc)sc.scrollTop=0}
  }finally{NAV.fromHash=false}
});

function gstLive(inp){
  const pos=inp.selectionStart;inp.value=inp.value.toUpperCase().replace(/[^0-9A-Z]/g,"");inp.setSelectionRange(pos,pos);
  const r=gstCheck(inp.value),box=document.getElementById("gstInfo");
  inp.style.borderColor=r.ok?"var(--ok)":(!r.partial&&r.msg?"var(--danger)":"");
  if(!r.ok){document.querySelectorAll("#custForm [data-auto]").forEach(el=>{el.value="";delete el.dataset.auto});box.innerHTML=r.msg?`<span style="color:${r.partial?"var(--ink3)":"var(--danger)"};font-weight:600">${esc(r.msg)}</span>`:"";return}
  const saved=DB.customers.find(c=>c.gstin===r.g&&c.id!==(S.sheet&&S.sheet.id));
  const tax=r.stateCode===COMPANY.stateCode?"CGST 9% + SGST 9%":"IGST 18%";
  box.innerHTML=`<div style="background:var(--ok-bg);color:var(--ok);padding:9px 11px;border-radius:10px;font-weight:600;line-height:1.5">
    ✓ Valid GSTIN · ${esc(r.state)} (${r.stateCode})<br><span style="color:var(--ink2);font-weight:500">PAN ${r.pan} · ${tax}</span>
    ${saved?`<br><span style="color:var(--brand2)">Already saved: details filled in</span>`:""}</div>
    ${saved?"":`<div id="gstLook" class="muted" style="margin-top:7px">${SERVER&&TOKEN?"🔎 Fetching name &amp; address from GST…":`Name &amp; address fill in automatically when the app is opened from your server. For now type them in, or check on the
    <a href="https://services.gst.gov.in/services/searchtp" target="_blank" rel="noopener" style="color:var(--brand2);font-weight:700">GST portal</a>.`}</div>`}`;
  const set=(id,v)=>{const el=document.getElementById(id);if(el&&v&&(!el.value||el.dataset.auto)){el.value=v;el.dataset.auto=1}};
  set("cState",r.state);
  if(saved){set("cName",saved.name);set("cAddr",saved.address);return}
  if(SERVER&&TOKEN)gstFetch(r.g);
}
async function gstFetch(g){
  const show=h=>{const el=document.getElementById("gstLook");if(el&&document.getElementById("gstIn")?.value===g)el.innerHTML=h};
  try{
    const r=await api("/api/gstin/"+g);
    if(document.getElementById("gstIn")?.value!==g)return;          // user changed the number meanwhile
    const d=r.data;
    if(r.ok&&d.legal_name){
      const fill=(id,v)=>{const el=document.getElementById(id);if(el&&v&&(!el.value||el.dataset.auto)){el.value=v;el.dataset.auto=1}};
      fill("cName",d.legal_name);fill("cAddr",d.address);fill("cState",d.state_name);
      const bad=d.status&&!/^active$/i.test(d.status);
      show(`<div style="padding:9px 11px;border-radius:10px;font-weight:600;line-height:1.5;background:${bad?"#fdecea":"var(--info-bg)"};color:${bad?"var(--danger)":"var(--brand2)"}">
        ${bad?"⚠ GST status: "+esc(d.status)+" — check before billing":"✓ Name &amp; address filled from GST records"}
        ${d.trade_name&&d.trade_name!==d.legal_name?`<br><span style="font-weight:500;color:var(--ink2)">Trade name: ${esc(d.trade_name)}</span>`:""}
        ${d.status&&!bad?`<br><span style="font-weight:500;color:var(--ink2)">Status: ${esc(d.status)}${d.registered_on?" · since "+esc(d.registered_on):""}</span>`:""}</div>`);
    }else if(d.source==="offline"){show("GST lookup is not set up on the server yet (add the provider key in .env). Please type name &amp; address.")}
    else{show(`<span style="color:var(--danger);font-weight:600">${esc(d.error||"Lookup failed")}</span> — please type name &amp; address.`)}
  }catch(e){show("Could not reach the server. Please type name &amp; address.")}
}

class JsR{
  constructor(pdf){this.p=pdf;this.page=1}

  color(c){this.p.setTextColor(c[0],c[1],c[2])}

  text(s,x,y,al){this.p.text(String(s),x,y,al&&al!=="left"?{align:al}:undefined)}
  rect(x,y,w,h,fill,stroke,lw=.2,r=0){
    if(fill)this.p.setFillColor(fill[0],fill[1],fill[2]);
    if(stroke){this.p.setDrawColor(stroke[0],stroke[1],stroke[2]);this.p.setLineWidth(lw)}
    const st=fill&&stroke?"FD":fill?"F":"S";

class CanR{
  constructor(k){this.k=k;this.cv=[];this.addPage()}
  addPage(){const c=document.createElement("canvas");c.width=Math.round(210*this.k);c.height=Math.round(297*this.k);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.textBaseline="alphabetic";this.cv.push(c);this.x=x}
  font(b,s){this.x.font=`${b?"bold ":""}${s*25.4/72*this.k}px Helvetica, Arial, sans-serif`}
  color(c){this.x.fillStyle=`rgb(${c})`}
  width(s){return this.x.measureText(String(s)).width/this.k}
  text(s,x,y,al){this.x.textAlign=al||"left";this.x.fillText(String(s),x*this.k,y*this.k)}
  rect(x,y,w,h,fill,stroke,lw=.2,r=0){const k=this.k,X=this.x,fs=X.fillStyle;X.beginPath();
    r&&X.roundRect?X.roundRect(x*k,y*k,w*k,h*k,r*k):X.rect(x*k,y*k,w*k,h*k);
    if(fill){X.fillStyle=`rgb(${fill})`;X.fill()}
    if(stroke){X.strokeStyle=`rgb(${stroke})`;X.lineWidth=Math.max(.6,lw*k);X.stroke()}X.fillStyle=fs}

  img(im,x,y,w,h){try{this.x.drawImage(im,x*this.k,y*this.k,w*this.k,h*this.k)}catch(e){}}
  pages(){return this.cv.length}
  setPage(i){this.x=this.cv[i-1].getContext("2d")}
}

    wy=lines(wrap(T.words,tx0-M-6),M,wy+8,4)}
  y=Math.max(ty,wy)+6;

  /* ---------- terms, bank, signature ---------- */
  const bl=[];
  if(cfg.show.terms&&d.type==="QUOTATION"&&COMPANY.terms)bl.push(["Terms & Conditions",COMPANY.terms]);
  const bank=cfg.show.bank?[`Cheque payable to "${COMPANY.name}"`,`A/c No: ${COMPANY.acc}   ·   ${COMPANY.bank}`,`IFSC: ${COMPANY.ifsc}   ·   Branch: ${COMPANY.branch}`]:[];
  const est=bl.length*10+(bank.length?bank.length*4+6:0)+(cfg.show.sign?24:0);
  if(y+Math.min(est,60)>BOT){R.addPage();y=14}
  const by=y;
  bl.forEach(([k,v])=>{R.font(true,F(7.8));R.color(A);R.text(k.toUpperCase(),M,y);R.font(false,F(8));R.color(INK);y=lines(wrap(v,tx0-M-6),M,y+4,3.6)+2.5});
  if(bank.length){R.font(true,F(7.8));R.color(A);R.text("BANK DETAILS",M,y);R.font(false,F(8));R.color(INK);y=lines(bank,M,y+4,3.8)+2}
  if(cfg.show.sign){R.font(true,F(8.4));R.color(INK);R.text("For "+COMPANY.name,W-M,by,"right");
    R.line(W-M-55,by+17,W-M,by+17,LN,.3);R.font(false,F(7.8));R.color(GR);R.text(cfg.signLabel||"Authorised Signature",W-M,by+21,"right");y=Math.max(y,by+23)}

  /* ---------- footer on every page ---------- */
  const n=R.pages();
  for(let p=1;p<=n;p++){R.setPage(p);R.line(M,289,W-M,289,AM,.3);R.font(false,F(6.8));R.color(GR);
    if(cfg.footer)R.text(cfg.footer.slice(0,140),M,292.5);
    if(cfg.show.pageno)R.text(`${d.no}  ·  Page ${p} of ${n}`,W-M,292.5,"right")}
  R.setPage(n);
}

async function makePDF(d,cfg=cfgFor(d)){
  await needLibs("pdf");
  const imgs=await pdfImages(d,cfg);
  const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
  pdf.setProperties({title:`${LABEL[d.type]} ${d.no}`,author:COMPANY.name});
  drawDoc(new JsR(pdf),d,cfg,imgs);
  return pdf.output("blob");
}
let pvToken=0;
async function drawPreview(el,d,cfg=cfgFor(d)){
  if(!el||!d)return;const my=++pvToken;
  const imgs=await pdfImages(d,cfg);if(my!==pvToken||!el.isConnected)return;
  const k=Math.min(6,Math.max(2,(el.clientWidth||360)*(window.devicePixelRatio||1)/210));
  const R=new CanR(k);
  try{drawDoc(R,d,cfg,imgs)}catch(e){console.error(e);el.innerHTML='<div class="empty">Preview failed</div>';return}
  el.innerHTML="";R.cv.forEach((c,i)=>{c.className="pvpage";c.setAttribute("aria-label",`Page ${i+1}`);el.appendChild(c)});window.PV_LAST={key:S.screen+"|"+(d&&d.id),cv:R.cv};
  const cnt=document.getElementById("pvCount");if(cnt)cnt.textContent=R.cv.length+(R.cv.length>1?" pages":" page");
}

const INR_FMT='[>=10000000]##\\,##\\,##\\,##0.00;[>=100000]##\\,##\\,##0.00;##,##0.00';
function exportXLSX(d,btn){busy(btn,async()=>{
  await needLibs("xlsx");
  const c=cust(d.customerId),T=d.t,wb=new ExcelJS.Workbook();wb.creator=COMPANY.name;
  const ws=wb.addWorksheet(d.no,{pageSetup:{paperSize:9,orientation:"portrait",fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:.4,right:.4,top:.5,bottom:.5,header:.2,footer:.2}}});
  ws.columns=[6,34,12,14,9,9,10,13,9,16].map(width=>({width}));
  const navy="FF0F3B4C",light="FFECF2F5",thin={style:"thin",color:{argb:"FFAAB4B9"}},box={top:thin,left:thin,bottom:thin,right:thin};
  const put=(addr,v,st={})=>{const cell=ws.getCell(addr);cell.value=v;Object.assign(cell,st);return cell};
  ws.mergeCells("A1:J1");put("A1",LABEL[d.type].toUpperCase(),{font:{bold:true,size:16,color:{argb:navy}},alignment:{horizontal:"center"}});
  ws.mergeCells("A2:F2");put("A2",COMPANY.name,{font:{bold:true,size:12}});
  ws.mergeCells("G2:J2");put("G2","Factory: "+COMPANY.factory,{font:{size:8},alignment:{wrapText:true,vertical:"top"}});
  ws.mergeCells("A3:F3");put("A3",COMPANY.reg,{font:{size:9},alignment:{wrapText:true}});ws.getRow(3).height=26;
  ws.mergeCells("G3:J3");put("G3","Ph No: "+COMPANY.phone,{font:{size:9}});
  ws.mergeCells("A4:J4");put("A4",`GSTIN: ${COMPANY.gstin}     PAN: ${COMPANY.pan}`,{font:{bold:true,size:9}});
  ws.mergeCells("A6:F6");put("A6","Billed & Delivered to",{font:{size:8,color:{argb:"FF5A6970"}}});
  ws.mergeCells("A7:F7");put("A7",c.name,{font:{bold:true,size:11}});
  ws.mergeCells("A8:F9");put("A8",c.address||"",{font:{size:9},alignment:{wrapText:true,vertical:"top"}});
  ws.mergeCells("A10:F10");put("A10","GST NO: "+(c.gstin||"-"),{font:{bold:true,size:9}});
  [[LABEL[d.type]+" No",d.no],["Date",fmtDate(d.date)],["Place of Supply",COMPANY.state],["State Code",c.stateCode||""],["Transport",trOf(d).mode]].forEach(([k,v],i)=>{
    const r=6+i;ws.mergeCells(`G${r}:H${r}`);ws.mergeCells(`I${r}:J${r}`);
    put("G"+r,k,{font:{size:9,color:{argb:"FF5A6970"}}});put("I"+r,v,{font:{bold:true,size:9},alignment:{horizontal:"right"}})});
  if(trList(d).length){ws.mergeCells("A11:J11");put("A11",trList(d).map(([k,v])=>k+": "+v).join("   |   "),{font:{size:9,bold:true},alignment:{wrapText:true,vertical:"middle"},
    border:{top:{style:"thin"},bottom:{style:"thin"},left:{style:"thin"},right:{style:"thin"}}});ws.getRow(11).height=trList(d).length>4?30:18}
  const H=12;
  ["Sl.No","Description","HSN","Profile Code","Packets","Lengths in pkt","Total Lengths","Weight (kgs)","Rate /kg","Amount in Rs"].forEach((h,i)=>{
    const cell=ws.getRow(H).getCell(i+1);cell.value=h;cell.font={bold:true,color:{argb:"FFFFFFFF"},size:9};
    cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:navy}};cell.alignment={horizontal:"center",vertical:"middle",wrapText:true};cell.border=box});
  ws.getRow(H).height=30;
  let r=H+1,last=null;const first=r;
  d.lines.forEach((l,i)=>{
    if(l.series!==last){ws.mergeCells(`A${r}:J${r}`);const cc=ws.getCell("A"+r);cc.value=l.series;cc.font={bold:true,color:{argb:navy},size:9};
      cc.alignment={horizontal:"center"};cc.fill={type:"pattern",pattern:"solid",fgColor:{argb:light}};cc.border=box;last=l.series;r++}
    const row=ws.getRow(r);
    const lenCell=l.packets?{formula:`E${r}*F${r}`,result:l.lengths}:l.lengths;
    row.values=[i+1,l.desc+(l.note?` (${l.note})`:""),l.hsn,l.code,l.packets||null,l.packets?l.lpp:null,lenCell,l.weight,l.rate,{formula:`ROUND(H${r}*I${r},2)`,result:l.amount}];
    row.eachCell({includeEmpty:true},(cell,col)=>{cell.border=box;cell.font={size:9};if(col!==2)cell.alignment={horizontal:col>=8?"right":"center"}});
    row.getCell(8).numFmt="0.000";row.getCell(9).numFmt="0.00";row.getCell(10).numFmt=INR_FMT;r++;
  });
  const lastItem=r-1;
  const tr=ws.getRow(r);ws.mergeCells(`A${r}:F${r}`);
  tr.getCell(1).value="Total";tr.getCell(7).value={formula:`SUM(G${first}:G${lastItem})`,result:T.lengths};
  tr.getCell(8).value={formula:`SUM(H${first}:H${lastItem})`,result:T.weight};tr.getCell(10).value={formula:`SUM(J${first}:J${lastItem})`,result:T.taxable};
  tr.eachCell({includeEmpty:true},(cell,col)=>{cell.font={bold:true,size:9};cell.border=box;cell.alignment={horizontal:col===1?"right":col>=8?"right":"center"}});
  tr.getCell(8).numFmt="0.000";tr.getCell(10).numFmt=INR_FMT;
  const taxRow=r;r+=2;
  const line=(label,formula,result,bold)=>{ws.mergeCells(`G${r}:I${r}`);put("G"+r,label,{font:{bold:true,size:bold?11:9},border:box});
    put("J"+r,{formula,result},{numFmt:INR_FMT,font:{bold:true,size:bold?11:9},border:box,alignment:{horizontal:"right"}});
    if(bold){["G","J"].forEach(k=>{ws.getCell(k+r).fill={type:"pattern",pattern:"solid",fgColor:{argb:navy}};ws.getCell(k+r).font={bold:true,size:11,color:{argb:"FFFFFFFF"}}})}
    return r++};
  const tx=line("Total Taxable Value",`J${taxRow}`,T.taxable);
  const g=[];
  if(T.igst)g.push(line("IGST @ 18%",`ROUND(J${tx}*18%,2)`,T.igst));
  else{g.push(line("CGST @ 9%",`ROUND(J${tx}*9%,2)`,T.cgst));g.push(line("SGST @ 9%",`ROUND(J${tx}*9%,2)`,T.sgst))}
  const sumExpr=`J${tx}+`+g.map(x=>"J"+x).join("+");
  line("Round Off",`ROUND(${sumExpr},0)-(${sumExpr})`,T.round);
  const gr=line("Total Invoice Value",`ROUND(${sumExpr},0)`,T.grand,true);
  ws.getCell("J"+gr).numFmt=INR_FMT.replace(/\.00/g,"");
  if(d.oldBalance){
    ws.mergeCells(`G${r}:I${r}`);put("G"+r,"Old Balance"+(d.oldBalanceNote?` (${d.oldBalanceNote})`:""),{font:{bold:true,size:9},border:box,alignment:{wrapText:true}});
    put("J"+r,d.oldBalance,{numFmt:INR_FMT,font:{bold:true,size:9},border:box});const ob=r++;
    line("Total Amount Due",`J${gr}+J${ob}`,due(d),true);ws.getCell("J"+(r-1)).numFmt=INR_FMT.replace(/\.00/g,"");
  }
  const wr=taxRow+2;ws.mergeCells(`A${wr}:E${wr}`);put("A"+wr,"Amount in words",{font:{size:8,color:{argb:"FF5A6970"}}});
  ws.mergeCells(`A${wr+1}:E${wr+2}`);put("A"+(wr+1),T.words,{font:{bold:true,size:10},alignment:{wrapText:true,vertical:"top"}});
  r+=1;
  if(d.type==="QUOTATION"){ws.mergeCells(`A${r}:J${r}`);put("A"+r,"Terms & Conditions: "+COMPANY.terms,{font:{bold:true,size:9}});r+=2}
  [`Chq payable In the Name of "${COMPANY.name}"`,`CA - A/c NO: ${COMPANY.acc}`,`Bank: ${COMPANY.bank}`,`IFSC: ${COMPANY.ifsc}`,`Branch: ${COMPANY.branch}`].forEach((t,i)=>{ws.mergeCells(`A${r+i}:F${r+i}`);put("A"+(r+i),t,{font:{size:9}})});
  ws.mergeCells(`G${r}:J${r}`);put("G"+r,"For Raviraja Industries Pvt Ltd",{font:{bold:true,size:9},alignment:{horizontal:"right"}});
  ws.mergeCells(`G${r+4}:J${r+4}`);put("G"+(r+4),"Authorised Signature",{font:{size:9},alignment:{horizontal:"right"}});
  ws.pageSetup.printArea=`A1:J${r+4}`;
  const buf=await wb.xlsx.writeBuffer();
  await saveFile(fname(d)+".xlsx",new Blob([buf]));
})}

function exportStock(btn){busy(btn,async()=>{
  await needLibs("xlsx");
  const wb=new ExcelJS.Workbook(),P=DB.prices;
  const combos=[];P.brands.forEach(b=>P.finishes.forEach(f=>combos.push([b,f])));
  const ws=wb.addWorksheet("Stock "+today());
  ws.columns=[{header:"Brand",key:"b",width:12},{header:"Finish",key:"f",width:14},{header:"Series",key:"s",width:16},{header:"Profile code",key:"c",width:13},
   {header:"Description",key:"d",width:30},{header:"Lengths/pkt",key:"lpp",width:11},{header:"Packets",key:"pk",width:9},{header:"Loose lengths",key:"lo",width:12},
   {header:"Total lengths",key:"len",width:12},{header:"Kg/length",key:"lw",width:10},{header:"Weight (kg)",key:"kg",width:12}];
  const seen=new Set();
  combos.forEach(([b,f])=>PROFILES.forEach(p=>{const k=stockKey(p.code,b,f);if(seen.has(k))return;seen.add(k);
    const len=+DB.stock[k]||0;if(!len)return;const reinf=CAT(p)==="REINF";
    const row=ws.addRow({b,f:reinf?"-":f,s:p.series,c:p.code,d:p.desc,lpp:reinf?null:p.lpp,pk:reinf?null:Math.trunc(len/p.lpp),lo:reinf?len:len%p.lpp,len,lw:p.lw});
    row.getCell("kg").value={formula:`I${row.number}*J${row.number}`,result:r3(len*p.lw)};}));
  const n=ws.rowCount;
  if(n>1){const t=ws.addRow({d:"TOTAL"});t.getCell("len").value={formula:`SUM(I2:I${n})`};t.getCell("kg").value={formula:`SUM(K2:K${n})`};t.font={bold:true}}
  ws.getRow(1).eachCell(c=>{c.font={bold:true,color:{argb:"FFFFFFFF"}};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF0F3B4C"}}});
  ws.getColumn("kg").numFmt="0.000";ws.views=[{state:"frozen",ySplit:1}];
  const mv=wb.addWorksheet("Movements");
  mv.columns=[{header:"Date",key:"at",width:18},{header:"Profile|Brand|Finish",key:"k",width:28},{header:"Type",key:"t",width:8},{header:"Lengths",key:"l",width:10},{header:"Balance",key:"bal",width:10},{header:"Ref",key:"r",width:12},{header:"Note",key:"n",width:30}];
  DB.moves.forEach(m=>mv.addRow({at:new Date(m.at).toLocaleString("en-IN"),k:m.key.replace(/\|-$/,""),t:m.type,l:m.lengths,bal:m.bal,r:m.ref,n:m.note}));
  mv.getRow(1).font={bold:true};
  const buf=await wb.xlsx.writeBuffer();
  await saveFile(`Raviraja_stock_${today()}.xlsx`,new Blob([buf]));
})}

/* ---------- WhatsApp ---------- */
const waPhone=ph=>{let n=String(ph||"").replace(/\D/g,"");if(n.length===11&&n[0]==="0")n=n.slice(1);if(n.length===10)n="91"+n;return n.length>=11&&n.length<=13?n:""};
function waText(d,withItems){const c=cust(d.customerId),T=d.t,t=trOf(d),L=[];
  L.push(`*${COMPANY.name}*`,"",`Dear ${c.name},`,"");
  L.push(d.type==="QUOTATION"?`Please find our *Quotation ${d.no}* dated ${fmtDate(d.date)}.`:
         d.type==="PI"?`Please find our *Purchase Order ${d.no}* dated ${fmtDate(d.date)}.`:`Please find *Tax Invoice ${d.no}* dated ${fmtDate(d.date)}.`);
  if(withItems){L.push("");d.lines.forEach((l,i)=>L.push(`${i+1}. ${l.desc} (${l.code})${l.variant?" - "+l.variant:""}: ${l.packets?l.packets+" pkt / ":""}${l.lengths} len${d.hideWeight?"":", "+kg(l.weight)+" kg"}${d.hideRate?"":" @ Rs "+l.rate+"/kg"} = Rs ${inr(l.amount)}`))}
  L.push("",d.hideWeight?`Total lengths: ${T.lengths}`:`Total weight: ${kg(T.weight)} kg (${T.lengths} lengths)`,`Taxable value: Rs ${inr(T.taxable)}`);
  if(T.igst)L.push(`IGST 18%: Rs ${inr(T.igst)}`);else L.push(`CGST 9%: Rs ${inr(T.cgst)}`,`SGST 9%: Rs ${inr(T.sgst)}`);
  L.push(`*${d.type==="INVOICE"?"Invoice":"Total"} amount: Rs ${inr(T.grand,0)}*`);
  if(d.oldBalance)L.push(`Old balance: Rs ${inr(d.oldBalance)}`,`*Total amount due: Rs ${inr(due(d),0)}*`);
  if(d.type!=="QUOTATION"&&trList(d).length)L.push("",`Dispatch (${t.mode}): `+trList(d).map(([k,v])=>`${k} ${v}`).join(", "));
  if(d.type==="QUOTATION")L.push("",COMPANY.terms);
  L.push("",`Bank: ${COMPANY.bank}, A/c ${COMPANY.acc}, IFSC ${COMPANY.ifsc}`,"",`Thank you,`,COMPANY.short,`Ph: ${COMPANY.phone}`);
  return L.join("\n")}
async function sharePDF(d,btn){busy(btn,async()=>{
  const blob=await makePDF(d),name=fname(d)+".pdf";
  await dlReady;
  if(!DL&&navigator.canShare){const file=new File([blob],name,{type:"application/pdf"});
    if(navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:d.no,text:`${LABEL[d.type]} ${d.no}`});return}
      catch(e){if(e&&e.name==="AbortError")return}}}
  await saveFile(name,blob);
  toast("PDF saved: attach it in WhatsApp with 📎");
})}
